<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>RecruiterAI — Analiza currículums con IA</title>
    <meta
      name="description"
      content="Sube hasta 5 CV en PDF y pega la oferta de trabajo: RecruiterAI puntúa a cada candidato con IA (habilidades, experiencia, fit cultural) y devuelve un ranking con preguntas de entrevista."
    />

    <!-- Colours -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />

    <!-- PWA -->
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RecruiterAI" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="RecruiterAI — Analiza currículums con IA" />
    <meta
      property="og:description"
      content="Convierte una oferta de trabajo y hasta 5 CV en un ranking de candidatos con puntuaciones, fit cultural y preguntas de entrevista."
    />
    <!-- NOTE: switch to an absolute URL (https://…) once the app has a public domain. -->
    <meta property="og:image" content="/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RecruiterAI — ranking de candidatos con IA" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RecruiterAI — Analiza currículums con IA" />
    <meta
      name="twitter:description"
      content="Convierte una oferta de trabajo y hasta 5 CV en un ranking de candidatos con puntuaciones, fit cultural y preguntas de entrevista."
    />
    <meta name="twitter:image" content="/og-cover.png" />

    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong mode.
      // Must read the same key as src/hooks/useTheme.ts.
      ;(function () {
        try {
          var stored = localStorage.getItem('recruiterai-theme')
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          /* ignore */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
